[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # data ingestion
    "statsbombpy>=1.12",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    # data / feature engineering
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    # database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # validation
    "great-expectations>=0.18",
    # modeling
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.44",
    "joblib>=1.3",
    # api
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # task queue + cache
    "celery[redis]>=5.3",
    "redis>=5.0",
    # config
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # dashboard
    "streamlit>=1.33",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

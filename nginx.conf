events {
    worker_connections 1024;
}

http {
    # Rate limiting: 10 requests/second per source IP, 10MB zone (holds ~160K IPs)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream fastapi {
        server api:8000;
    }

    upstream streamlit_app {
        server streamlit:8501;
    }

    # ── API gateway (port 80) ───────────────────────────────────────────────
    server {
        listen 80;

        # /api/* → FastAPI: strip /api prefix before proxying (/api/teams → /teams)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://fastapi/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Health check passthrough (no rate limit)
        location /health {
            proxy_pass http://fastapi/health;
        }
    }

    # ── Streamlit (port 8501) — WebSocket-aware ─────────────────────────────
    server {
        listen 8501;

        location / {
            proxy_pass       http://streamlit_app/;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Streamlit uses WebSockets for live updates — must upgrade the connection
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}
